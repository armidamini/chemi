[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemeng-open-tools"
version = "0.1.0"
description = "Transparent introductory chemical engineering calculation tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["chemical-engineering", "hydraulics", "fluid-mechanics", "heat-transfer", "engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/armidamini/chemi"
Repository = "https://github.com/armidamini/chemi"
Issues = "https://github.com/armidamini/chemi/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
